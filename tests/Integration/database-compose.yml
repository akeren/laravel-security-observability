name: security-observability-database-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: security_observability_test
      MYSQL_USER: telemetry_test
      MYSQL_PASSWORD: synthetic-test-password
      MYSQL_ROOT_PASSWORD: synthetic-root-password
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psynthetic-root-password"]
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: security_observability_test
      POSTGRES_USER: telemetry_test
      POSTGRES_PASSWORD: synthetic-test-password
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "telemetry_test", "-d", "security_observability_test"]
      interval: 2s
      timeout: 5s
      retries: 60
